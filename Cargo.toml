[package]
name = "bluetooth-force"
version = "3.0.0"
edition = "2024"
rust-version = "1.85"
description = "Keep paired Bluetooth earbuds connected, with a native reconnect path and a verified recovery ladder."
publish = false
build = "build.rs"

[[bin]]
name = "bluetooth_force"
path = "src/main.rs"

# Zero external crates on purpose: every Win32 entry point is declared by hand
# in `src/sys`, so the binary builds fully offline and the ABI contract stays
# explicit and reviewable.
[dependencies]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
# Symbols stay in the binary ON PURPOSE. A stripped, unsigned, metadata-free
# executable is the shape generic antivirus heuristics punish hardest; keeping
# the symbol names costs a few hundred KB and makes the binary readable to
# anyone who wants to check what it does.
strip = false

[profile.dev]
# Unit tests and debug runs keep unwinding so failures are catchable.
